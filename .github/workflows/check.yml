name: Check formula

# The install gate of the release flow: the release
# workflow opens a pull request on this repo with the rendered formula, this
# workflow installs and tests it on every supported platform, and a
# maintainer merges. Make it a required status check on `main`. Only pull
# requests from branches of this repo (the release bot) are checked; a
# fork's formula is never installed on a runner.
#
# Every same-repo pull request runs it, so a README or workflow change can
# satisfy the required checks too. With no Formula/harell.rb (a new tap, before
# the first stable release) the check passes without installing anything; a
# change that removes an existing formula fails (.github/scripts/formula-present.sh).

on:
  pull_request:
  push:
    branches: [main]
    paths: ["Formula/**"]

permissions:
  contents: read

jobs:
  check:
    # Same-repo pull requests and pushes to main only.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    strategy:
      fail-fast: false
      matrix:
        # One runner per formula branch: darwin/arm64, darwin/amd64,
        # linux/amd64, linux/arm64.
        os: [macos-latest, macos-26-intel, ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
      HOMEBREW_NO_ANALYTICS: "1"
      HOMEBREW_NO_ENV_HINTS: "1"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # Same-repo PR: check out the PR head, not a merge commit.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Is there a formula to check?
        id: formula
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          # Compare with the commit this change replaces: the pull request's
          # base, or the previous tip of main for a push.
          previous=""
          if [ "$EVENT" = pull_request ]; then
            git fetch --depth=1 origin "$BASE_REF"
            previous="$(git rev-parse FETCH_HEAD)"
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != 0000000000000000000000000000000000000000 ]; then
            git fetch --depth=1 origin "$BEFORE"
            previous="$BEFORE"
          fi
          bash .github/scripts/formula-present.sh "$previous"

      - name: Formula sha256 stanzas must match the release's checksums.txt
        if: steps.formula.outputs.present == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(sed -n 's/^  version "\(.*\)"$/\1/p' Formula/harell.rb)
          test -n "$version"
          gh release download "v$version" --repo "$GITHUB_REPOSITORY" --pattern checksums.txt --dir release
          count=0
          for sha in $(sed -n 's/^ *sha256 "\([0-9a-f]\{64\}\)"$/\1/p' Formula/harell.rb); do
            grep -q "^$sha  " release/checksums.txt || { echo "::error::sha256 $sha in Formula/harell.rb is not in the v$version release checksums"; exit 1; }
            count=$((count + 1))
          done
          test "$count" -eq 4

      - name: Put Homebrew on PATH (Linux)
        if: runner.os == 'Linux' && steps.formula.outputs.present == 'true'
        run: echo "/home/linuxbrew/.linuxbrew/bin" >> "$GITHUB_PATH"

      - name: Install the formula from a throwaway tap
        if: steps.formula.outputs.present == 'true'
        run: |
          set -euo pipefail
          brew tap-new --no-git harell-ci/candidate
          cp Formula/harell.rb "$(brew --repository harell-ci/candidate)/Formula/harell.rb"
          # `--except version`: GoReleaser writes an explicit version stanza
          # that Homebrew's audit reports as redundant with the URL's version.
          brew audit --strict --online --except version harell-ci/candidate/harell
          brew install harell-ci/candidate/harell
          harell version | tee version.txt
          version=$(sed -n 's/^  version "\(.*\)"$/\1/p' Formula/harell.rb)
          grep -F "harell-cli v$version " version.txt
          brew test harell-ci/candidate/harell
